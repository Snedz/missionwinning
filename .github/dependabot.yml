# Dependabot — continuous dependency risk signal (compliance MW-CHG-004)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    # Keep @types/node on the same major as CI/runtime (Node 22). A types major
    # without a runtime move only creates close-noise (e.g. closed PR #213).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    # .276 pinned checkout + upload-artifact at v5 deliberately; Dependabot's
    # jump to v7 was closed as #75/#77. Allow patch/minor only until we choose v6+.
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/upload-artifact"
        update-types: ["version-update:semver-major"]
