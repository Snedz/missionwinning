# Extended CI — manual / weekly only (minutes-heavy).
# Default gate is .github/workflows/ci.yml (lint · typecheck · tests · build).
name: CI extended

on:
  workflow_dispatch:
  schedule:
    # Weekly Android + critical e2e (UTC Monday 08:17)
    - cron: '17 8 * * 1'

concurrency:
  group: ci-extended-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-critical:
    runs-on: ubuntu-latest
    env:
      PRIVATE_MODE: 'false'
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Production build
        run: npm run build

      - name: Start server
        run: |
          npm run start &
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:3000/log >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/log >/dev/null || (echo "Server failed to start" && exit 1)

      - name: Critical path E2E
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
        run: npm run e2e:critical

  lighthouse-budget:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start production server
        run: |
          npm run build
          npm run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/private >/dev/null && break
            sleep 2
          done

      - name: Install Lighthouse
        run: npm i -D lighthouse chrome-launcher

      - name: Lighthouse budget (soft warning)
        env:
          SMOKE_BASE_URL: http://localhost:3000
        run: node scripts/lighthouse-budget.mjs

  visual-regression:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build + start server
        run: |
          npm run build
          npm run start &
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000/api/health >/dev/null && break
            sleep 2
          done

      - name: Visual regression (@visual, soft until baselines committed)
        env:
          SMOKE_BASE_URL: http://localhost:3000
          PRIVATE_MODE: 'false'
        run: |
          if [ -z "$(find tests/e2e -type d -name '*-snapshots' 2>/dev/null | head -1)" ]; then
            echo "No *-snapshots dirs yet — generating baselines (soft job)."
            npx playwright test --config=playwright.config.ts --grep @visual --update-snapshots || true
            echo "Commit snapshot files from the visual-diffs / screenshots artifact, then remove continue-on-error."
          fi
          npm run e2e:visual

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            test-results/
            tests/e2e/**/*-snapshots/
          if-no-files-found: ignore
          retention-days: 14

  gate-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remote security / gate smoke
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_ACCESS_SECRET: ${{ secrets.SMOKE_ACCESS_SECRET }}
        run: |
          if [ -z "$SMOKE_BASE_URL" ]; then
            echo "Skipping security-smoke (SMOKE_BASE_URL not set)"
            exit 0
          fi
          npm run security-smoke

  growth-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remote growth smoke
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_ACCESS_SECRET: ${{ secrets.SMOKE_ACCESS_SECRET }}
        run: |
          if [ -z "$SMOKE_BASE_URL" ]; then
            echo "Skipping growth-smoke (SMOKE_BASE_URL not set)"
            exit 0
          fi
          npm run growth-smoke

  rate-limit-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remote rate-limit smoke
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
        run: |
          if [ -z "$SMOKE_BASE_URL" ]; then
            echo "Skipping rate-limit-smoke (SMOKE_BASE_URL not set)"
            exit 0
          fi
          set +e
          npm run rate-limit-smoke
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "rate-limit-smoke OK (429 seen)"
            exit 0
          fi
          if [ "$code" -eq 2 ]; then
            echo "::warning::No 429 — Production likely missing UPSTASH_REDIS_REST_* (Wave A). See docs/PRODUCTION_STACK.md L9."
            exit 0
          fi
          echo "rate-limit-smoke hard failure (exit $code)"
          exit "$code"

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install platform + build-tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble debug + all-module unit tests
        run: |
          ./gradlew :app:assembleDebug testDebugUnitTest --stacktrace

      - name: Release packaging smoke (debug-signed)
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab

      - name: Upload release AAB (debug-signed)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 7

      - name: Room schema present (exportSchema discipline)
        run: |
          test -d core/data/schemas
          test -n "$(find core/data/schemas -name '*.json' | head -1)"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Maestro wedge present
        run: |
          test -f .maestro/wedge.yaml
          grep -q 'Start workout' .maestro/wedge.yaml
          grep -q 'Complete set' .maestro/wedge.yaml
          grep -q 'Session locked' .maestro/wedge.yaml
          grep -q 'Account' .maestro/wedge.yaml
          grep -q 'Preferences' .maestro/wedge.yaml
          grep -q 'assertNotVisible' .maestro/wedge.yaml
          grep -q 'Account tab' scripts/wedge-adb-walk.py
          grep -q 'assert_absent' scripts/wedge-adb-walk.py
          test -x scripts/release-smoke.sh

      - name: Auth scaffold + Baseline Profile stub
        run: |
          ./gradlew :feature:auth:assembleDebug :benchmark:assemble --stacktrace

      - name: Logger + sync invariant modules (explicit)
        run: |
          ./gradlew :feature:active:testDebugUnitTest :core:model:testDebugUnitTest :core:data:testDebugUnitTest :core:common:testDebugUnitTest --stacktrace
