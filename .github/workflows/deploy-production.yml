# Production deploy when Vercel Git integration only creates Preview deployments.
# Auto-runs on push to master so www.missionwinning.com does not fall days behind.
#
# Setup (GitHub → Settings → Secrets → Actions):
#   VERCEL_TOKEN — https://vercel.com/account/tokens
#   VERCEL_ORG_ID — Team ID (team_Akwar4ZvbahQp5HR911ebrlW)
#   VERCEL_PROJECT_ID — prj_yqoUE2ENzRRdeiMdqkqyC49czxxp
name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Skipping deploy — set VERCEL_TOKEN and VERCEL_PROJECT_ID in GitHub Secrets"
            exit 1
          fi
          npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx vercel build --prod --token "$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
