# Lean CI — PR + manual only. Master pushes do not run this workflow so
# remaining Actions minutes go to deploy-production.yml (www updates).
# Extended jobs (e2e, Android, lighthouse, smokes): Actions → CI extended.
name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Dependency audit (high)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Export locale JSON (smoke)
        run: npm run export-locales

      - name: i18n parity (APP_LANGS)
        run: npm run i18n:parity

      - name: Deploy readiness
        run: npx tsx -e "import { assertDeployReady } from './src/lib/deployReadiness'; assertDeployReady();"

      - name: Compliance status (soft)
        continue-on-error: true
        run: npm run compliance:status -- --ci

      - name: Upload compliance status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-status
          path: compliance-status.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Production build
        run: npm run build
