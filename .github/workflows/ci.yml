# Lean CI — PR + manual only. Master pushes do not re-run this workflow because
# every change reaches master through a PR (enforced by branch protection), so the
# commit has already been tested green here. This is a duplicate-work choice, not a
# billing one: standard runners are free and unlimited on public repos.
# Extended jobs (e2e, Android, lighthouse, smokes): Actions → CI extended.
name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Hero e2e runs in this job so the production build happens exactly once.
    # PRIVATE_MODE=false compiles the service worker, which the offline spec needs.
    env:
      PRIVATE_MODE: 'false'
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Dependency audit (high)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Export locale JSON (smoke)
        run: npm run export-locales

      - name: i18n parity (APP_LANGS)
        run: npm run i18n:parity

      - name: Deploy readiness
        run: npx tsx -e "import { assertDeployReady } from './src/lib/deployReadiness'; assertDeployReady();"

      - name: Compliance status (soft)
        continue-on-error: true
        run: npm run compliance:status -- --ci

      - name: Upload compliance status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-status
          path: compliance-status.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Production build
        run: npm run build

      # The logger is the product — a PR that breaks it must not go green.
      # Chromium only, @gate-tagged specs only; a11y / visual / Lighthouse stay in CI extended.
      - name: Install Playwright chromium
        run: npx playwright install chromium

      - name: Start server
        run: |
          npm run start &
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:3000/log >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/log >/dev/null || (echo "Server failed to start" && exit 1)

      - name: Hero path E2E (gate)
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
        run: npm run e2e:gate
