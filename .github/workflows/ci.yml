# Lean CI — PR + manual only. Master pushes do not run this workflow so
# remaining Actions minutes go to deploy-production.yml (www updates).
# Extended jobs (e2e, Android, lighthouse, smokes): Actions → CI extended.
name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Hero e2e runs in this job so the production build happens exactly once.
    # PRIVATE_MODE=false compiles the service worker, which the offline spec needs.
    env:
      PRIVATE_MODE: 'false'
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      # `.198` added this placeholder to `scripts/gate.mjs` and not here, and
      # first-90.spec.ts's own comment says the key was "unset in CI until now —
      # see gate.mjs", which reads as though this lane was covered. It was not:
      # gate.mjs is the *local* gate. So the two lanes built different
      # configurations, and the one test that depends on it passed locally and
      # failed here — invisibly, because Actions was billing-blocked and this job
      # died at `runner_id: 0` before it could run. A guard nobody runs is a
      # guard that does not exist (`ciTruth.test.ts`).
      #
      # `isPushSupported()` returns false without a VAPID public key, so the push
      # opt-in renders *nothing* and the evening day-review assertion has no
      # element to measure. Safe: this is the public half of a keypair and only
      # gates whether the UI draws. Nothing can subscribe — the server has no
      # private key, and no test grants notification permission.
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `origin/master` exists — check-build-label compares the
          # branch's APP_BUILD_LABEL against the base. Under the default shallow
          # clone that ref is absent and the check silently skips, which would have
          # made the step below decorative rather than a gate.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # These three ran only in `npm run gate` (local). Two of them exist because the
      # regression they catch already happened once — .129 shipped 10 sites where a
      # `text-*` utility nullified a `.display-*` clamp, and .131 pinned the brand
      # tokens after the rebrand. A guard nobody runs on a PR is not a guard, and
      # branches from other sessions never run the local gate.
      - name: Build label + hard rule 5
        run: npm run check-build-label

      - name: Display type
        run: npm run check-display-type

      - name: Token sync (web ↔ Android)
        run: npm run check-token-sync

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Route contract tests
        run: npm run test:routes

      # `.226` — the two lanes above report pass/fail; this reports how much of the
      # codebase they touched, over every source file rather than only the ones
      # something imported. Here as well as in `npm run gate` on purpose: `.213`
      # found the two had silently diverged, and `.200`/`.219` were both checks
      # that existed and ran nowhere.
      - name: Coverage floors
        run: npm run coverage

      - name: Dependency audit (high)
        # `npm run security-audit`, not the raw command: package.json already
        # defines it, and two spellings of one check is how they drift.
        run: npm run security-audit
        continue-on-error: true

      - name: Export locale JSON (smoke)
        run: npm run export-locales

      - name: i18n parity (APP_LANGS)
        run: npm run i18n:parity

      - name: Deploy readiness
        run: npx tsx -e "import { assertDeployReady } from './src/lib/deployReadiness'; assertDeployReady();"

      - name: Compliance status (soft)
        continue-on-error: true
        run: npm run compliance:status -- --ci

      - name: Upload compliance status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-status
          path: compliance-status.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Production build
        run: npm run build

      # The logger is the product — a PR that breaks it must not go green.
      # Chromium only, @gate-tagged specs only.
      #
      # `.226` — this line used to claim "a11y / visual / Lighthouse stay in CI
      # extended". Visual and Lighthouse do. **a11y does not**: `ci-extended.yml`
      # has no such job, so those 34 tests run in `npm run gate` and nowhere else.
      # `gate.mjs`'s header already called this comment out as false and it was
      # still here. Whether to spend PR minutes on a11y is a founder call — the
      # comment is corrected rather than the lane silently added.
      - name: Install Playwright chromium
        run: npx playwright install chromium

      - name: Start server
        run: |
          npm run start &
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:3000/log >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/log >/dev/null || (echo "Server failed to start" && exit 1)

      - name: Hero path E2E (gate)
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
        run: npm run e2e:gate
