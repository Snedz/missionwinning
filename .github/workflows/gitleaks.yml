# Secret scan — PR + manual only; every change reaches master through a PR, so a
# master-push run would re-scan an already-scanned commit. (Not a billing limit:
# standard runners are free and unlimited on public repos.)
#
# Defence in depth: GitHub secret scanning + push protection reject known provider
# tokens at push time, before the commit lands; this job catches the custom shapes
# defined in .gitleaks.toml that GitHub does not know about.
#
# Local pre-commit gate: npm run secrets:scan
# Docs: docs/SECRETS.md
name: Gitleaks

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
