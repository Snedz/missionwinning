# Secret scan — PR + manual only (lean; do not run on every master push).
# Local gate while Actions billing is blocked: npm run secrets:scan
# Docs: docs/SECRETS.md
name: Gitleaks

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
