# Optional CodeQL — enable GitHub Advanced Security / Code scanning on the repo
# for this workflow to produce alerts. Soft compliance signal (MW-INC-004).
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 7 * * 1'

jobs:
  analyze:
    name: Analyze
    # Soft until founder enables Code scanning (Settings → Security).
    # Upload fails with a hard error when scanning is disabled — do not block master.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
