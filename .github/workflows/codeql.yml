# Optional CodeQL — needs Code scanning enabled on the repo to produce alerts.
# Soft compliance signal (MW-INC-004).
#
# Manual-only while the repo is PRIVATE. Code scanning on a private repo requires
# GitHub Advanced Security; without it the analyze step's upload 403s. The old
# monthly cron therefore spent ~5 min of a metered quota to guarantee a failure
# that `continue-on-error` then hid. It last genuinely succeeded 2026-08-01,
# while the repo was still public.
#
# Restore the cron below if the repo goes public again — scanning and Actions
# minutes are both free there.
name: CodeQL

on:
  # schedule:
  #   - cron: '17 7 1 * *'   # monthly; re-enable when public
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    # Soft until founder enables Code scanning (Settings → Security).
    # Upload fails with a hard error when scanning is disabled — do not block master.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
