# One-shot: apply a SQL migration against production Supabase using Vercel env.
# Uses Vercel CLI in CI (Sensitive secrets decrypt there; local pull redacts them).
#
# Required secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
name: Apply Supabase migration

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Path under supabase/migrations'
        required: true
        default: 'supabase/migrations/20260721_beta_invites.sql'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI + pg
        run: |
          npm install -g vercel@latest
          npm install pg

      - name: Pull production env (decrypted in CI)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_ORG_ID" ]; then
            echo "Missing VERCEL_TOKEN / VERCEL_PROJECT_ID / VERCEL_ORG_ID"
            exit 1
          fi
          mkdir -p .vercel
          printf '%s\n' "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\",\"projectName\":\"missionwinning\"}" > .vercel/project.json
          vercel env pull .env.production --environment=production --yes --token "$VERCEL_TOKEN"
          # Sanity: lengths only
          node -e "
            const fs=require('fs');
            const t=fs.readFileSync('.env.production','utf8');
            for (const k of ['SUPABASE_SERVICE_ROLE_KEY','SUPABASE_URL','POSTGRES_URL','POSTGRES_URL_NON_POOLING','POSTGRES_PASSWORD','POSTGRES_HOST']) {
              const m=t.match(new RegExp('^'+k+'=(.*)$','m'));
              const v=(m?m[1]:'').replace(/^[\"']|[\"']$/g,'');
              console.log(k+': len='+v.length);
            }
          "

      - name: Apply migration SQL
        env:
          MIGRATION_FILE: ${{ inputs.migration_file }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { Client } = require('pg');
          const path = process.env.MIGRATION_FILE;
          if (!fs.existsSync(path)) {
            console.error('Missing migration file:', path);
            process.exit(1);
          }
          const envText = fs.readFileSync('.env.production', 'utf8');
          const env = {};
          for (const line of envText.split('\n')) {
            if (!line || line.startsWith('#') || !line.includes('=')) continue;
            const i = line.indexOf('=');
            const k = line.slice(0, i);
            let v = line.slice(i + 1).trim();
            if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) {
              v = v.slice(1, -1);
            }
            env[k] = v;
          }
          const sql = fs.readFileSync(path, 'utf8');
          // Prefer direct (non-pooling) for DDL
          const connectionString =
            env.POSTGRES_URL_NON_POOLING ||
            env.POSTGRES_URL ||
            env.DATABASE_URL ||
            null;
          async function run() {
            let client;
            if (connectionString) {
              console.log('Connecting via POSTGRES_URL*');
              client = new Client({
                connectionString,
                ssl: { rejectUnauthorized: false },
              });
            } else if (env.POSTGRES_HOST && env.POSTGRES_PASSWORD && env.POSTGRES_USER) {
              console.log('Connecting via POSTGRES_HOST');
              client = new Client({
                host: env.POSTGRES_HOST,
                user: env.POSTGRES_USER,
                password: env.POSTGRES_PASSWORD,
                database: env.POSTGRES_DATABASE || 'postgres',
                port: 5432,
                ssl: { rejectUnauthorized: false },
              });
            } else if (env.SUPABASE_SERVICE_ROLE_KEY && (env.SUPABASE_URL || env.NEXT_PUBLIC_SUPABASE_URL)) {
              // Fall back: Management/SQL not available via service role REST alone.
              console.error('No Postgres connection string in Vercel env. Have POSTGRES_URL?');
              console.error('Service role present:', Boolean(env.SUPABASE_SERVICE_ROLE_KEY));
              process.exit(1);
            } else {
              console.error('No database credentials available from vercel env pull');
              process.exit(1);
            }
            await client.connect();
            try {
              console.log('Applying', path, '(' + sql.length + ' bytes)');
              await client.query(sql);
              // Verify
              const check = await client.query(`
                select
                  to_regclass('public.beta_invites') as beta_invites,
                  to_regclass('public.checkout_recovery') as checkout_recovery,
                  exists(
                    select 1 from information_schema.columns
                    where table_schema='public' and table_name='profiles' and column_name='invited_via'
                  ) as invited_via
              `);
              console.log('Verify:', check.rows[0]);
              console.log('OK');
            } finally {
              await client.end();
            }
          }
          run().catch((e) => {
            console.error(e);
            process.exit(1);
          });
          NODE
