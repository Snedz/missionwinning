# Mission Winning — compliance control catalog (Vanta-lite)
#
# NOT A CERTIFICATION. Operational hygiene + evidence pointers only.
# Do not claim SOC 2, ISO 27001, or HIPAA compliance in product/marketing.
# HIPAA rows are technical-safeguard mapping only — we are not a covered entity
# and do not claim to process PHI under HIPAA.
#
# Frameworks: soc2 | iso27001 | hipaa | ccpa | coppa | play_data | ftc_ai
# owner: agent (CI/repo) | founder (manual ops)
# probe: doc_exists | headers | deploy_readiness | dependabot | ci_audit | source_scan | manual | partial | n_a
# source_scan: require[] must all appear; forbid[] must not. known_open: fail→partial; pass→stale fail.
# status seed: automated | manual | partial | n_a

version: 2
disclaimer: >
  Control monitoring and evidence pointers only — not a SOC 2, ISO 27001, HIPAA,
  CCPA, COPPA, or Play certification. Educational fitness product; HIPAA mapped
  technically only. Privacy tags (ccpa/coppa/play_data/ftc_ai) are maps, not attestations.

