<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" role="img" aria-label="Deadlift form: setup, pull, lockout">
  <title>Deadlift form diagram</title>
  <rect width="360" height="220" fill="#0a0c10" rx="8"/>
  <text x="60" y="28" text-anchor="middle" fill="#8b919a" font-family="system-ui,sans-serif" font-size="11">Setup</text>
  <text x="180" y="28" text-anchor="middle" fill="#8b919a" font-family="system-ui,sans-serif" font-size="11">Pull</text>
  <text x="300" y="28" text-anchor="middle" fill="#8b919a" font-family="system-ui,sans-serif" font-size="11">Lockout</text>
  <line x1="20" y1="185" x2="100" y2="185" stroke="#2a3038" stroke-width="2"/>
  <line x1="140" y1="185" x2="220" y2="185" stroke="#2a3038" stroke-width="2"/>
  <line x1="260" y1="185" x2="340" y2="185" stroke="#2a3038" stroke-width="2"/>

  <!-- Setup hinge -->
  <g stroke="#e8eaed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="72" cy="95" r="9"/>
    <line x1="68" y1="104" x2="55" y2="145"/>
    <line x1="55" y1="120" x2="38" y2="145"/>
    <line x1="55" y1="120" x2="48" y2="155"/>
    <line x1="55" y1="145" x2="48" y2="175"/>
    <line x1="55" y1="145" x2="70" y2="175"/>
    <line x1="35" y1="155" x2="75" y2="155"/>
  </g>
  <circle cx="55" cy="145" r="3.5" fill="#c7a860"/>
  <text x="55" y="138" text-anchor="middle" fill="#c7a860" font-family="system-ui,sans-serif" font-size="8">hips</text>
  <text x="55" y="170" text-anchor="middle" fill="#c7a860" font-family="system-ui,sans-serif" font-size="8">bar</text>

  <!-- Pull -->
  <g stroke="#e8eaed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="185" cy="80" r="9"/>
    <line x1="182" y1="89" x2="175" y2="130"/>
    <line x1="175" y1="110" x2="160" y2="130"/>
    <line x1="175" y1="110" x2="168" y2="145"/>
    <line x1="175" y1="130" x2="165" y2="175"/>
    <line x1="175" y1="130" x2="190" y2="175"/>
    <line x1="155" y1="145" x2="195" y2="145"/>
  </g>
  <path d="M200 140 L200 115" stroke="#27b07d" stroke-width="2" stroke-linecap="round">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <polygon points="196,115 200,108 204,115" fill="#27b07d"/>
  <text x="210" y="128" fill="#27b07d" font-family="system-ui,sans-serif" font-size="9">push floor</text>

  <!-- Lockout -->
  <g stroke="#e8eaed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="300" cy="65" r="9"/>
    <line x1="300" y1="74" x2="300" y2="125"/>
    <line x1="300" y1="95" x2="285" y2="120"/>
    <line x1="300" y1="95" x2="315" y2="120"/>
    <line x1="300" y1="125" x2="288" y2="175"/>
    <line x1="300" y1="125" x2="312" y2="175"/>
    <line x1="280" y1="120" x2="320" y2="120"/>
  </g>
  <circle cx="300" cy="125" r="3.5" fill="#c7a860"/>
  <text x="318" y="128" fill="#c7a860" font-family="system-ui,sans-serif" font-size="8">lock</text>
</svg>
