<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" role="img" aria-label="Air squat: stand, depth, stand">
  <style>
    /* Hero form motion — only when the athlete allows motion. */
    @media (prefers-reduced-motion: no-preference) {
      .form-phase-mid {
        animation: form-mid-bob 2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center bottom;
      }
      .form-cue-pulse {
        animation: form-cue-pulse 2s ease-in-out infinite;
      }
    }
    @keyframes form-mid-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }
    @keyframes form-cue-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
  <title>Air squat form diagram</title>
  <rect width="360" height="220" fill="#f3f2f2"></rect>
  <text x="60" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">STAND</text>
  <text x="180" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">DEPTH</text>
  <text x="300" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">STAND</text>
  <line x1="20" y1="185" x2="100" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="140" y1="185" x2="220" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="260" y1="185" x2="340" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="60" cy="55" r="9"></circle>
    <line x1="60" y1="55" x2="60" y2="69"></line>
    <line x1="60" y1="69" x2="60" y2="118"></line>
    <line x1="60" y1="69" x2="58" y2="73"></line>
    <line x1="58" y1="73" x2="78" y2="79"></line>
    <line x1="78" y1="79" x2="96" y2="77"></line>
    <line x1="58" y1="73" x2="82" y2="85"></line>
    <line x1="82" y1="85" x2="100" y2="83"></line>
    <line x1="60" y1="118" x2="52" y2="145"></line>
    <line x1="52" y1="145" x2="44" y2="185"></line>
    <line x1="60" y1="118" x2="74" y2="147"></line>
    <line x1="74" y1="147" x2="78" y2="185"></line>
  </g>
  <g class="form-phase-mid" stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="183.8" cy="85.4" r="9"></circle>
    <line x1="183.8" y1="85.4" x2="183.8" y2="99.4"></line>
    <line x1="183.8" y1="99.4" x2="180" y2="154.1"></line>
    <line x1="183.8" y1="99.4" x2="181.8" y2="103.4"></line>
    <line x1="181.8" y1="103.4" x2="198" y2="109.4"></line>
    <line x1="198" y1="109.4" x2="216" y2="107.4"></line>
    <line x1="181.8" y1="103.4" x2="202" y2="115.4"></line>
    <line x1="202" y1="115.4" x2="220" y2="113.4"></line>
    <line x1="180" y1="154.1" x2="162.5" y2="156.4"></line>
    <line x1="162.5" y1="156.4" x2="158.3" y2="185"></line>
    <line x1="180" y1="154.1" x2="199.7" y2="158.4"></line>
    <line x1="199.7" y1="158.4" x2="205.6" y2="185"></line>
  </g>
  <circle class="form-cue-pulse" cx="180" cy="152" r="3.5" fill="#ec3013"></circle>
  <text x="180" y="144" text-anchor="middle" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="8">depth</text>
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="300" cy="55" r="9"></circle>
    <line x1="300" y1="55" x2="300" y2="69"></line>
    <line x1="300" y1="69" x2="300" y2="118"></line>
    <line x1="300" y1="69" x2="298" y2="73"></line>
    <line x1="298" y1="73" x2="318" y2="79"></line>
    <line x1="318" y1="79" x2="336" y2="77"></line>
    <line x1="298" y1="73" x2="322" y2="85"></line>
    <line x1="322" y1="85" x2="340" y2="83"></line>
    <line x1="300" y1="118" x2="292" y2="145"></line>
    <line x1="292" y1="145" x2="284" y2="185"></line>
    <line x1="300" y1="118" x2="314" y2="147"></line>
    <line x1="314" y1="147" x2="318" y2="185"></line>
  </g>
  <path class="form-cue-pulse" d="M300 155 L300 125" stroke="#ec3013" stroke-width="2" stroke-linecap="round"></path>
  <polygon class="form-cue-pulse" points="300,125 304,133 296,133" fill="#ec3013"></polygon>
</svg>
