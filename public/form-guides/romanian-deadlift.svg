<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" role="img" aria-label="RDL: stand, hinge, lockout">
  <style>
    /* Hero form motion — only when the athlete allows motion. */
    @media (prefers-reduced-motion: no-preference) {
      .form-phase-mid {
        animation: form-mid-bob 2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center bottom;
      }
      .form-cue-pulse {
        animation: form-cue-pulse 2s ease-in-out infinite;
      }
    }
    @keyframes form-mid-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }
    @keyframes form-cue-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
  <title>Romanian deadlift form diagram</title>
  <rect width="360" height="220" fill="#f3f2f2"></rect>
  <text x="60" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">STAND</text>
  <text x="180" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">HINGE</text>
  <text x="300" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">LOCKOUT</text>
  <line x1="20" y1="185" x2="100" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="140" y1="185" x2="220" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="260" y1="185" x2="340" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="75.4" cy="72.4" r="9"></circle>
    <line x1="75.4" y1="72.4" x2="69.4" y2="86.4"></line>
    <line x1="69.4" y1="86.4" x2="60" y2="128"></line>
    <line x1="69.4" y1="86.4" x2="67.4" y2="90.4"></line>
    <line x1="67.4" y1="90.4" x2="77.4" y2="108.4"></line>
    <line x1="77.4" y1="108.4" x2="64" y2="128"></line>
    <line x1="67.4" y1="90.4" x2="81.4" y2="112.4"></line>
    <line x1="81.4" y1="112.4" x2="74" y2="128"></line>
    <line x1="60" y1="128" x2="50" y2="155"></line>
    <line x1="50" y1="155" x2="42" y2="185"></line>
    <line x1="60" y1="128" x2="72" y2="155"></line>
    <line x1="72" y1="155" x2="80" y2="185"></line>
  </g>
  <line x1="40" y1="128" x2="80" y2="128" stroke="#201e1d" stroke-width="3" stroke-linecap="round"></line>
  <g class="form-phase-mid" stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="215" cy="78" r="9"></circle>
    <line x1="215" y1="78" x2="209" y2="92"></line>
    <line x1="209" y1="92" x2="180" y2="128"></line>
    <line x1="209" y1="92" x2="207" y2="96"></line>
    <line x1="207" y1="96" x2="217" y2="114"></line>
    <line x1="217" y1="114" x2="184" y2="165"></line>
    <line x1="207" y1="96" x2="221" y2="118"></line>
    <line x1="221" y1="118" x2="194" y2="165"></line>
    <line x1="180" y1="128" x2="170" y2="155"></line>
    <line x1="170" y1="155" x2="162" y2="185"></line>
    <line x1="180" y1="128" x2="192" y2="155"></line>
    <line x1="192" y1="155" x2="200" y2="185"></line>
  </g>
  <line x1="168" y1="165" x2="208" y2="165" stroke="#201e1d" stroke-width="3" stroke-linecap="round"></line>
  <circle class="form-cue-pulse" cx="180" cy="128" r="3.5" fill="#ec3013"></circle>
  <text x="180" y="120" text-anchor="middle" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="8">hinge</text>
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="315.4" cy="72.4" r="9"></circle>
    <line x1="315.4" y1="72.4" x2="309.4" y2="86.4"></line>
    <line x1="309.4" y1="86.4" x2="300" y2="128"></line>
    <line x1="309.4" y1="86.4" x2="307.4" y2="90.4"></line>
    <line x1="307.4" y1="90.4" x2="317.4" y2="108.4"></line>
    <line x1="317.4" y1="108.4" x2="304" y2="128"></line>
    <line x1="307.4" y1="90.4" x2="321.4" y2="112.4"></line>
    <line x1="321.4" y1="112.4" x2="314" y2="128"></line>
    <line x1="300" y1="128" x2="290" y2="155"></line>
    <line x1="290" y1="155" x2="282" y2="185"></line>
    <line x1="300" y1="128" x2="312" y2="155"></line>
    <line x1="312" y1="155" x2="320" y2="185"></line>
  </g>
  <line x1="280" y1="128" x2="320" y2="128" stroke="#201e1d" stroke-width="3" stroke-linecap="round"></line>
</svg>
