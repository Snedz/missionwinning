<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" role="img" aria-label="KB swing: hike, snap, float">
  <style>
    /* Hero form motion — only when the athlete allows motion. */
    @media (prefers-reduced-motion: no-preference) {
      .form-phase-mid {
        animation: form-mid-bob 2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center bottom;
      }
      .form-cue-pulse {
        animation: form-cue-pulse 2s ease-in-out infinite;
      }
    }
    @keyframes form-mid-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }
    @keyframes form-cue-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
  <title>Kettlebell swing form diagram</title>
  <rect width="360" height="220" fill="#f3f2f2"></rect>
  <text x="60" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">HIKE</text>
  <text x="180" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">SNAP</text>
  <text x="300" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">FLOAT</text>
  <line x1="20" y1="185" x2="100" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="140" y1="185" x2="220" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="260" y1="185" x2="340" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="93.6" cy="77.6" r="9"></circle>
    <line x1="93.6" y1="77.6" x2="87.6" y2="91.6"></line>
    <line x1="87.6" y1="91.6" x2="60" y2="128"></line>
    <line x1="87.6" y1="91.6" x2="85.6" y2="95.6"></line>
    <line x1="85.6" y1="95.6" x2="95.6" y2="113.6"></line>
    <line x1="95.6" y1="113.6" x2="64" y2="168"></line>
    <line x1="85.6" y1="95.6" x2="99.6" y2="117.6"></line>
    <line x1="99.6" y1="117.6" x2="74" y2="168"></line>
    <line x1="60" y1="128" x2="50" y2="155"></line>
    <line x1="50" y1="155" x2="42" y2="185"></line>
    <line x1="60" y1="128" x2="72" y2="155"></line>
    <line x1="72" y1="155" x2="80" y2="185"></line>
  </g>
  <circle cx="65" cy="172" r="9" fill="none" stroke="#201e1d" stroke-width="2"></circle>
  <circle class="form-cue-pulse" cx="60" cy="128" r="3.5" fill="#ec3013"></circle>
  <text x="60" y="120" text-anchor="middle" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="8">hinge</text>
  <g class="form-phase-mid" stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="180" cy="55" r="9"></circle>
    <line x1="180" y1="55" x2="180" y2="69"></line>
    <line x1="180" y1="69" x2="180" y2="118"></line>
    <line x1="180" y1="69" x2="178" y2="73"></line>
    <line x1="178" y1="73" x2="198" y2="79"></line>
    <line x1="198" y1="79" x2="216" y2="77"></line>
    <line x1="178" y1="73" x2="202" y2="85"></line>
    <line x1="202" y1="85" x2="220" y2="83"></line>
    <line x1="180" y1="118" x2="172" y2="145"></line>
    <line x1="172" y1="145" x2="164" y2="185"></line>
    <line x1="180" y1="118" x2="194" y2="147"></line>
    <line x1="194" y1="147" x2="198" y2="185"></line>
  </g>
  <circle cx="218" cy="95" r="9" fill="none" stroke="#201e1d" stroke-width="2"></circle>
  <path class="form-cue-pulse" d="M180 155 L180 125" stroke="#ec3013" stroke-width="2" stroke-linecap="round"></path>
  <polygon class="form-cue-pulse" points="180,125 184,133 176,133" fill="#ec3013"></polygon>
  <text x="190" y="140" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="9">hips</text>
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="300" cy="55" r="9"></circle>
    <line x1="300" y1="55" x2="300" y2="69"></line>
    <line x1="300" y1="69" x2="300" y2="118"></line>
    <line x1="300" y1="69" x2="298" y2="73"></line>
    <line x1="298" y1="73" x2="318" y2="79"></line>
    <line x1="318" y1="79" x2="336" y2="77"></line>
    <line x1="298" y1="73" x2="322" y2="85"></line>
    <line x1="322" y1="85" x2="340" y2="83"></line>
    <line x1="300" y1="118" x2="292" y2="145"></line>
    <line x1="292" y1="145" x2="284" y2="185"></line>
    <line x1="300" y1="118" x2="314" y2="147"></line>
    <line x1="314" y1="147" x2="318" y2="185"></line>
  </g>
  <circle cx="332" cy="68" r="9" fill="none" stroke="#201e1d" stroke-width="2"></circle>
  <circle class="form-cue-pulse" cx="332" cy="68" r="3.5" fill="#ec3013"></circle>
  <text x="332" y="60" text-anchor="middle" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="8">float</text>
</svg>
