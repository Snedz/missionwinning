<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" role="img" aria-label="Bench: setup, lower, press">
  <style>
    /* Hero form motion — only when the athlete allows motion. */
    @media (prefers-reduced-motion: no-preference) {
      .form-phase-mid {
        animation: form-mid-bob 2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center bottom;
      }
      .form-cue-pulse {
        animation: form-cue-pulse 2s ease-in-out infinite;
      }
    }
    @keyframes form-mid-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }
    @keyframes form-cue-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
  <title>Bench press form diagram</title>
  <rect width="360" height="220" fill="#f3f2f2"></rect>
  <text x="60" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">SETUP</text>
  <text x="180" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">LOWER</text>
  <text x="300" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">PRESS</text>
  <line x1="20" y1="185" x2="100" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="140" y1="185" x2="220" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="260" y1="185" x2="340" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <rect x="18" y="145" width="84" height="12" fill="none" stroke="#201e1d" stroke-width="2"></rect>
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="28" cy="128" r="9"></circle>
    <line x1="28" y1="128" x2="40" y2="138"></line>
    <line x1="40" y1="138" x2="82" y2="148"></line>
    <line x1="40" y1="138" x2="52" y2="132"></line>
    <line x1="52" y1="132" x2="58" y2="90"></line>
    <line x1="58" y1="90" x2="64" y2="72"></line>
    <line x1="52" y1="132" x2="78" y2="90"></line>
    <line x1="78" y1="90" x2="84" y2="72"></line>
    <line x1="82" y1="148" x2="98" y2="158"></line>
    <line x1="98" y1="158" x2="102" y2="185"></line>
    <line x1="82" y1="148" x2="92" y2="185"></line>
  </g>
  <line x1="38" y1="72" x2="98" y2="72" stroke="#201e1d" stroke-width="3" stroke-linecap="round"></line>


  <rect x="138" y="145" width="84" height="12" fill="none" stroke="#201e1d" stroke-width="2"></rect>
  <g class="form-phase-mid" stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="148" cy="128" r="9"></circle>
    <line x1="148" y1="128" x2="160" y2="138"></line>
    <line x1="160" y1="138" x2="202" y2="148"></line>
    <line x1="160" y1="138" x2="172" y2="132"></line>
    <line x1="172" y1="132" x2="178" y2="118"></line>
    <line x1="178" y1="118" x2="184" y2="100"></line>
    <line x1="172" y1="132" x2="198" y2="118"></line>
    <line x1="198" y1="118" x2="204" y2="100"></line>
    <line x1="202" y1="148" x2="218" y2="158"></line>
    <line x1="218" y1="158" x2="222" y2="185"></line>
    <line x1="202" y1="148" x2="212" y2="185"></line>
  </g>
  <line x1="158" y1="100" x2="218" y2="100" stroke="#201e1d" stroke-width="3" stroke-linecap="round"></line>
  <path class="form-cue-pulse" d="M228 75 L228 100" stroke="#ec3013" stroke-width="2" stroke-linecap="round"></path>
  <polygon class="form-cue-pulse" points="228,100 224,92 232,92" fill="#ec3013"></polygon>
  <text x="238" y="87.5" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="9">lower</text>

  <rect x="258" y="145" width="84" height="12" fill="none" stroke="#201e1d" stroke-width="2"></rect>
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="268" cy="128" r="9"></circle>
    <line x1="268" y1="128" x2="280" y2="138"></line>
    <line x1="280" y1="138" x2="322" y2="148"></line>
    <line x1="280" y1="138" x2="292" y2="132"></line>
    <line x1="292" y1="132" x2="298" y2="90"></line>
    <line x1="298" y1="90" x2="304" y2="72"></line>
    <line x1="292" y1="132" x2="318" y2="90"></line>
    <line x1="318" y1="90" x2="324" y2="72"></line>
    <line x1="322" y1="148" x2="338" y2="158"></line>
    <line x1="338" y1="158" x2="342" y2="185"></line>
    <line x1="322" y1="148" x2="332" y2="185"></line>
  </g>
  <line x1="278" y1="72" x2="338" y2="72" stroke="#201e1d" stroke-width="3" stroke-linecap="round"></line>

  <path class="form-cue-pulse" d="M348 105 L348 75" stroke="#ec3013" stroke-width="2" stroke-linecap="round"></path>
  <polygon class="form-cue-pulse" points="348,75 352,83 344,83" fill="#ec3013"></polygon>
  <text x="358" y="90" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="9">press</text>
</svg>
