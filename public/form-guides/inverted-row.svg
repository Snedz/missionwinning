  <text x="180" y="28" text-anchor="middle" fill="#8b919a" font-family="system-ui,sans-serif" font-size="11">Pull</text>
  <text x="300" y="28" text-anchor="middle" fill="#8b919a" font-family="system-ui,sans-serif" font-size="11">Lower</text>
  <line x1="25" y1="70" x2="95" y2="70" stroke="#c7a860" stroke-width="3" stroke-linecap="round"/>
  <line x1="145" y1="70" x2="215" y2="70" stroke="#c7a860" stroke-width="3" stroke-linecap="round"/>
  <line x1="265" y1="70" x2="335" y2="70" stroke="#c7a860" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="185" x2="340" y2="185" stroke="#2a3038" stroke-width="2"/>

