    <line x1="190" y1="90" x2="180" y2="109"/>
    <line x1="180" y1="140" x2="170" y2="175"/>
    <line x1="180" y1="140" x2="190" y2="175"/>
  </g>
  <path d="M210 120 L210 100" stroke="#27b07d" stroke-width="2" stroke-linecap="round"/>
