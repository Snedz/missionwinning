<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" role="img" aria-label="Inverted row form: hang, pull, lower">
  <title>Inverted row form diagram</title>
  <rect width="360" height="220" fill="#0a0c10" rx="8"/>
