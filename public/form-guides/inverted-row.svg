<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" role="img" aria-label="Inverted row: hang, pull, lower">
  <style>
    /* Hero form motion — only when the athlete allows motion. */
    @media (prefers-reduced-motion: no-preference) {
      .form-phase-mid {
        animation: form-mid-bob 2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center bottom;
      }
      .form-cue-pulse {
        animation: form-cue-pulse 2s ease-in-out infinite;
      }
    }
    @keyframes form-mid-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }
    @keyframes form-cue-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
  <title>Inverted row form diagram</title>
  <rect width="360" height="220" fill="#f3f2f2"></rect>
  <text x="60" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">HANG</text>
  <text x="180" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">PULL</text>
  <text x="300" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">LOWER</text>
  <line x1="20" y1="185" x2="100" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="140" y1="185" x2="220" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="260" y1="185" x2="340" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="20" y1="95" x2="100" y2="95" stroke="#201e1d" stroke-width="3" stroke-linecap="round"></line>
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="98" cy="135" r="9"></circle>
    <line x1="98" y1="135" x2="86" y2="142"></line>
    <line x1="86" y1="142" x2="40" y2="158"></line>
    <line x1="86" y1="142" x2="82" y2="144"></line>
    <line x1="82" y1="144" x2="78" y2="98"></line>
    <line x1="82" y1="144" x2="68" y2="98"></line>
    <line x1="40" y1="158" x2="12" y2="185"></line>
    <line x1="40" y1="158" x2="20" y2="185"></line>
  </g>
  <line x1="140" y1="95" x2="220" y2="95" stroke="#201e1d" stroke-width="3" stroke-linecap="round"></line>
  <g class="form-phase-mid" stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="212" cy="115" r="9"></circle>
    <line x1="212" y1="115" x2="200" y2="122"></line>
    <line x1="200" y1="122" x2="160" y2="148"></line>
    <line x1="200" y1="122" x2="196" y2="124"></line>
    <line x1="196" y1="124" x2="192" y2="108"></line>
    <line x1="192" y1="108" x2="196" y2="98"></line>
    <line x1="196" y1="124" x2="186" y2="98"></line>
    <line x1="160" y1="148" x2="132" y2="185"></line>
    <line x1="160" y1="148" x2="140" y2="185"></line>
  </g>
  <path class="form-cue-pulse" d="M180 155 L180 125" stroke="#ec3013" stroke-width="2" stroke-linecap="round"></path>
  <polygon class="form-cue-pulse" points="180,125 184,133 176,133" fill="#ec3013"></polygon>
  <text x="190" y="140" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="9">chest</text>
  <line x1="260" y1="95" x2="340" y2="95" stroke="#201e1d" stroke-width="3" stroke-linecap="round"></line>
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="338" cy="135" r="9"></circle>
    <line x1="338" y1="135" x2="326" y2="142"></line>
    <line x1="326" y1="142" x2="280" y2="158"></line>
    <line x1="326" y1="142" x2="322" y2="144"></line>
    <line x1="322" y1="144" x2="318" y2="98"></line>
    <line x1="322" y1="144" x2="308" y2="98"></line>
    <line x1="280" y1="158" x2="252" y2="185"></line>
    <line x1="280" y1="158" x2="260" y2="185"></line>
  </g>
</svg>
