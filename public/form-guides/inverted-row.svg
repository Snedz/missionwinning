  </g>
  <text x="60" y="200" text-anchor="middle" fill="#8b919a" font-family="system-ui,sans-serif" font-size="8">body line</text>

  <g stroke="#e8eaed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
