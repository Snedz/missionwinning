<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" role="img" aria-label="Barbell row form: hinge, pull, control">
  <title>Barbell row form diagram</title>
  <rect width="360" height="220" fill="#f3f2f2"></rect>
  <text x="60" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11">Hinge</text>
  <text x="180" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11">Pull</text>
  <text x="300" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11">Control</text>
  <line x1="20" y1="185" x2="100" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="140" y1="185" x2="220" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="260" y1="185" x2="340" y2="185" stroke="#201e1d" stroke-width="2"></line>

  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="75" cy="90" r="9"></circle>
    <line x1="70" y1="99" x2="55" y2="140"></line>
    <line x1="55" y1="120" x2="40" y2="145"></line>
    <line x1="55" y1="120" x2="48" y2="155"></line>
    <line x1="55" y1="140" x2="48" y2="175"></line>
    <line x1="55" y1="140" x2="68" y2="175"></line>
    <line x1="30" y1="155" x2="70" y2="155"></line>
  </g>
  <circle cx="55" cy="140" r="3.5" fill="#ec3013"></circle>
  <text x="72" y="142" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="8">flat back</text>

  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="195" cy="90" r="9"></circle>
    <line x1="190" y1="99" x2="175" y2="140"></line>
    <line x1="175" y1="115" x2="160" y2="125"></line>
    <line x1="175" y1="115" x2="168" y2="140"></line>
    <line x1="175" y1="140" x2="168" y2="175"></line>
    <line x1="175" y1="140" x2="188" y2="175"></line>
    <line x1="150" y1="125" x2="190" y2="125"></line>
  </g>
  <path d="M160 145 L160 128" stroke="#ec3013" stroke-width="2" stroke-linecap="round"></path>
  <polygon points="156,128 160,121 164,128" fill="#ec3013"></polygon>
  <text x="210" y="120" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="9">to hip</text>
  <circle cx="168" cy="120" r="3.5" fill="#ec3013"></circle>

  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="315" cy="90" r="9"></circle>
    <line x1="310" y1="99" x2="295" y2="140"></line>
    <line x1="295" y1="120" x2="280" y2="145"></line>
    <line x1="295" y1="120" x2="288" y2="155"></line>
    <line x1="295" y1="140" x2="288" y2="175"></line>
    <line x1="295" y1="140" x2="308" y2="175"></line>
    <line x1="270" y1="155" x2="310" y2="155"></line>
  </g>
  <path d="M290 130 L290 148" stroke="#ec3013" stroke-width="2" stroke-linecap="round"></path>
  <polygon points="286,148 290,155 294,148" fill="#ec3013"></polygon>
</svg>