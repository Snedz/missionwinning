<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" role="img" aria-label="Plank: setup, hold, exit">
  <style>
    /* Hero form motion — only when the athlete allows motion. */
    @media (prefers-reduced-motion: no-preference) {
      .form-phase-mid {
        animation: form-mid-bob 2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center bottom;
      }
      .form-cue-pulse {
        animation: form-cue-pulse 2s ease-in-out infinite;
      }
    }
    @keyframes form-mid-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }
    @keyframes form-cue-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
  <title>Plank form diagram</title>
  <rect width="360" height="220" fill="#f3f2f2"></rect>
  <text x="60" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">SETUP</text>
  <text x="180" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">HOLD</text>
  <text x="300" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">EXIT</text>
  <line x1="20" y1="185" x2="100" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="140" y1="185" x2="220" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="260" y1="185" x2="340" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="102" cy="122" r="9"></circle>
    <line x1="102" y1="122" x2="90" y2="128"></line>
    <line x1="90" y1="128" x2="42" y2="130"></line>
    <line x1="90" y1="128" x2="82" y2="130"></line>
    <line x1="82" y1="130" x2="84" y2="150"></line>
    <line x1="84" y1="150" x2="88" y2="183"></line>
    <line x1="82" y1="130" x2="78" y2="155"></line>
    <line x1="78" y1="155" x2="80" y2="183"></line>
    <line x1="42" y1="130" x2="30" y2="132"></line>
    <line x1="30" y1="132" x2="12" y2="183"></line>
    <line x1="42" y1="130" x2="24" y2="134"></line>
    <line x1="24" y1="134" x2="20" y2="183"></line>
  </g>
  <circle class="form-cue-pulse" cx="48" cy="130" r="3.5" fill="#ec3013"></circle>
  <text x="48" y="122" text-anchor="middle" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="8">line</text>
  <g class="form-phase-mid" stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="222" cy="122" r="9"></circle>
    <line x1="222" y1="122" x2="210" y2="128"></line>
    <line x1="210" y1="128" x2="162" y2="130"></line>
    <line x1="210" y1="128" x2="202" y2="130"></line>
    <line x1="202" y1="130" x2="204" y2="150"></line>
    <line x1="204" y1="150" x2="208" y2="183"></line>
    <line x1="202" y1="130" x2="198" y2="155"></line>
    <line x1="198" y1="155" x2="200" y2="183"></line>
    <line x1="162" y1="130" x2="150" y2="132"></line>
    <line x1="150" y1="132" x2="132" y2="183"></line>
    <line x1="162" y1="130" x2="144" y2="134"></line>
    <line x1="144" y1="134" x2="140" y2="183"></line>
  </g>
  <circle class="form-cue-pulse" cx="168" cy="130" r="3.5" fill="#ec3013"></circle>
  <text x="168" y="122" text-anchor="middle" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="8">brace</text>
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="300.6" cy="59.8" r="9"></circle>
    <line x1="300.6" y1="59.8" x2="300.6" y2="73.8"></line>
    <line x1="300.6" y1="73.8" x2="300" y2="123.7"></line>
    <line x1="300.6" y1="73.8" x2="298.6" y2="77.8"></line>
    <line x1="298.6" y1="77.8" x2="318" y2="83.8"></line>
    <line x1="318" y1="83.8" x2="336" y2="81.8"></line>
    <line x1="298.6" y1="77.8" x2="322" y2="89.8"></line>
    <line x1="322" y1="89.8" x2="340" y2="87.8"></line>
    <line x1="300" y1="123.7" x2="290.5" y2="146.8"></line>
    <line x1="290.5" y1="146.8" x2="283.1" y2="185"></line>
    <line x1="300" y1="123.7" x2="314.9" y2="148.8"></line>
    <line x1="314.9" y1="148.8" x2="319.2" y2="185"></line>
  </g>
</svg>
