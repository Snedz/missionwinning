<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" role="img" aria-label="Plank form: setup and hold line">
  <title>Plank form diagram</title>
  <rect width="360" height="220" fill="#f3f2f2"></rect>
  <text x="120" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11">Setup</text>
  <text x="260" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11">Hold</text>
  <line x1="40" y1="175" x2="200" y2="175" stroke="#201e1d" stroke-width="2"></line>
  <line x1="220" y1="175" x2="340" y2="175" stroke="#201e1d" stroke-width="2"></line>

  
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="175" cy="95" r="9"></circle>
    <line x1="168" y1="102" x2="90" y2="130"></line>
    <line x1="90" y1="130" x2="70" y2="155"></line>
    <line x1="100" y1="125" x2="90" y2="130"></line>
    <line x1="168" y1="102" x2="55" y2="155"></line>
  </g>
  <circle cx="90" cy="130" r="3.5" fill="#ec3013"></circle>
  <text x="90" y="122" text-anchor="middle" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="8">elbow</text>
  <path d="M130 85 L130 115" stroke="#ec3013" stroke-width="1.5" stroke-dasharray="4 3"></path>
  <text x="142" y="100" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="9">straight</text>

  
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="320" cy="95" r="9"></circle>
    <line x1="313" y1="102" x2="250" y2="130"></line>
    <line x1="250" y1="130" x2="235" y2="155"></line>
    <line x1="258" y1="125" x2="250" y2="130"></line>
    <line x1="313" y1="102" x2="225" y2="155"></line>
  </g>
  <path d="M270 140 L270 125" stroke="#ec3013" stroke-width="2" stroke-linecap="round"></path>
  <polygon points="266,125 270,118 274,125" fill="#ec3013"></polygon>
  <text x="278" y="138" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="9">no sag</text>
  <circle cx="280" cy="115" r="3.5" fill="#ec3013"></circle>
  <text x="280" y="108" text-anchor="middle" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="8">glutes</text>
</svg>