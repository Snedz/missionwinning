<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" role="img" aria-label="Hip thrust form: setup, drive, squeeze">
  <title>Hip thrust form diagram</title>
  <rect width="360" height="220" fill="#0a0c10" rx="8"/>
  <text x="60" y="28" text-anchor="middle" fill="#8b919a" font-family="system-ui,sans-serif" font-size="11">Setup</text>
  <text x="180" y="28" text-anchor="middle" fill="#8b919a" font-family="system-ui,sans-serif" font-size="11">Drive</text>
  <text x="300" y="28" text-anchor="middle" fill="#8b919a" font-family="system-ui,sans-serif" font-size="11">Squeeze</text>
  <line x1="20" y1="185" x2="340" y2="185" stroke="#2a3038" stroke-width="2"/>
  <!-- Bench backs -->
  <rect x="25" y="100" width="14" height="50" rx="2" fill="#2a3038"/>
  <rect x="145" y="100" width="14" height="50" rx="2" fill="#2a3038"/>
  <rect x="265" y="100" width="14" height="50" rx="2" fill="#2a3038"/>

  <g stroke="#e8eaed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="115" r="8"/>
    <line x1="55" y1="120" x2="90" y2="150"/>
    <line x1="90" y1="150" x2="80" y2="175"/>
    <line x1="90" y1="150" x2="105" y2="175"/>
    <line x1="70" y1="145" x2="100" y2="145"/>
  </g>
  <text x="85" y="140" fill="#c7a860" font-family="system-ui,sans-serif" font-size="8">bar</text>

  <g stroke="#e8eaed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="170" cy="110" r="8"/>
    <line x1="175" y1="115" x2="210" y2="120"/>
    <line x1="210" y1="120" x2="205" y2="175"/>
    <line x1="210" y1="120" x2="230" y2="175"/>
    <line x1="195" y1="118" x2="225" y2="118"/>
  </g>
  <path d="M210 150 L210 128" stroke="#27b07d" stroke-width="2" stroke-linecap="round"/>
  <polygon points="206,128 210,121 214,128" fill="#27b07d"/>
  <text x="220" y="145" fill="#27b07d" font-family="system-ui,sans-serif" font-size="9">hips up</text>
  <circle cx="210" cy="120" r="3.5" fill="#c7a860"/>

  <g stroke="#e8eaed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="290" cy="105" r="8"/>
    <line x1="295" y1="110" x2="330" y2="105"/>
    <line x1="330" y1="105" x2="325" y2="175"/>
    <line x1="330" y1="105" x2="348" y2="175"/>
    <line x1="315" y1="105" x2="345" y2="105"/>
  </g>
  <circle cx="330" cy="105" r="3.5" fill="#c7a860"/>
  <text x="330" y="96" text-anchor="middle" fill="#c7a860" font-family="system-ui,sans-serif" font-size="8">squeeze</text>
  <text x="300" y="200" text-anchor="middle" fill="#8b919a" font-family="system-ui,sans-serif" font-size="8">chin tucked · no over-arch</text>
</svg>
