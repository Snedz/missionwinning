<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" role="img" aria-label="Burpee form: squat, plank, jump">
  <title>Burpee form diagram</title>
  <rect width="360" height="220" fill="#0a0c10" rx="8"/>
  <text x="60" y="28" text-anchor="middle" fill="#8b919a" font-family="system-ui,sans-serif" font-size="11">Squat</text>
  <text x="180" y="28" text-anchor="middle" fill="#8b919a" font-family="system-ui,sans-serif" font-size="11">Plank</text>
  <text x="300" y="28" text-anchor="middle" fill="#8b919a" font-family="system-ui,sans-serif" font-size="11">Jump</text>
  <line x1="20" y1="185" x2="100" y2="185" stroke="#2a3038" stroke-width="2"/>
  <line x1="120" y1="185" x2="240" y2="185" stroke="#2a3038" stroke-width="2"/>
  <line x1="260" y1="185" x2="340" y2="185" stroke="#2a3038" stroke-width="2"/>

  <g stroke="#e8eaed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="60" cy="100" r="9"/>
    <line x1="60" y1="109" x2="55" y2="140"/>
    <line x1="55" y1="125" x2="40" y2="145"/>
    <line x1="55" y1="125" x2="70" y2="130"/>
    <line x1="55" y1="140" x2="45" y2="175"/>
    <line x1="55" y1="140" x2="70" y2="175"/>
  </g>
  <path d="M80 120 L95 140" stroke="#27b07d" stroke-width="2" stroke-linecap="round"/>
  <polygon points="90,140 98,142 94,134" fill="#27b07d"/>
  <text x="85" y="115" fill="#27b07d" font-family="system-ui,sans-serif" font-size="8">hands down</text>

  <g stroke="#e8eaed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="220" cy="100" r="9"/>
    <line x1="213" y1="107" x2="150" y2="130"/>
    <line x1="150" y1="130" x2="140" y2="155"/>
    <line x1="160" y1="125" x2="150" y2="130"/>
    <line x1="213" y1="107" x2="130" y2="155"/>
  </g>
  <text x="180" y="175" text-anchor="middle" fill="#8b919a" font-family="system-ui,sans-serif" font-size="8">kick back</text>

  <g stroke="#e8eaed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="300" cy="55" r="9"/>
    <line x1="300" y1="64" x2="300" y2="110"/>
    <line x1="300" y1="80" x2="285" y2="95"/>
    <line x1="300" y1="80" x2="315" y2="70"/>
    <line x1="300" y1="110" x2="290" y2="150"/>
    <line x1="300" y1="110" x2="310" y2="150"/>
  </g>
  <path d="M320 130 L320 100" stroke="#27b07d" stroke-width="2" stroke-linecap="round"/>
  <polygon points="316,100 320,93 324,100" fill="#27b07d"/>
  <text x="300" y="175" text-anchor="middle" fill="#27b07d" font-family="system-ui,sans-serif" font-size="9">jump</text>
</svg>
