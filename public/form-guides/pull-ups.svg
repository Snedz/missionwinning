<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" role="img" aria-label="Pull-up: hang, pull, lower">
  <style>
    /* Hero form motion — only when the athlete allows motion. */
    @media (prefers-reduced-motion: no-preference) {
      .form-phase-mid {
        animation: form-mid-bob 2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center bottom;
      }
      .form-cue-pulse {
        animation: form-cue-pulse 2s ease-in-out infinite;
      }
    }
    @keyframes form-mid-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }
    @keyframes form-cue-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
  <title>Pull-up form diagram</title>
  <rect width="360" height="220" fill="#f3f2f2"></rect>
  <text x="60" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">HANG</text>
  <text x="180" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">PULL</text>
  <text x="300" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">LOWER</text>
  <line x1="20" y1="185" x2="100" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="140" y1="185" x2="220" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="260" y1="185" x2="340" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="32" y1="48" x2="88" y2="48" stroke="#201e1d" stroke-width="3" stroke-linecap="round"></line>
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="60" cy="95" r="9"></circle>
    <line x1="60" y1="95" x2="60" y2="109"></line>
    <line x1="60" y1="109" x2="60" y2="145"></line>
    <line x1="60" y1="109" x2="46" y2="113"></line>
    <line x1="60" y1="109" x2="74" y2="113"></line>
    <line x1="46" y1="113" x2="38" y2="78"></line>
    <line x1="38" y1="78" x2="42" y2="50"></line>
    <line x1="74" y1="113" x2="82" y2="78"></line>
    <line x1="82" y1="78" x2="78" y2="50"></line>
    <line x1="60" y1="145" x2="52" y2="165"></line>
    <line x1="52" y1="165" x2="50" y2="185"></line>
    <line x1="60" y1="145" x2="68" y2="165"></line>
    <line x1="68" y1="165" x2="70" y2="185"></line>
  </g>
  <circle class="form-cue-pulse" cx="60" cy="50" r="3.5" fill="#ec3013"></circle>
  <text x="60" y="42" text-anchor="middle" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="8">dead hang</text>
  <line x1="152" y1="48" x2="208" y2="48" stroke="#201e1d" stroke-width="3" stroke-linecap="round"></line>
  <g class="form-phase-mid" stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="180" cy="62" r="9"></circle>
    <line x1="180" y1="62" x2="180" y2="76"></line>
    <line x1="180" y1="76" x2="180" y2="115"></line>
    <line x1="180" y1="76" x2="166" y2="80"></line>
    <line x1="180" y1="76" x2="194" y2="80"></line>
    <line x1="166" y1="80" x2="158" y2="58"></line>
    <line x1="158" y1="58" x2="162" y2="50"></line>
    <line x1="194" y1="80" x2="202" y2="58"></line>
    <line x1="202" y1="58" x2="198" y2="50"></line>
    <line x1="180" y1="115" x2="172" y2="135"></line>
    <line x1="172" y1="135" x2="170" y2="155"></line>
    <line x1="180" y1="115" x2="188" y2="135"></line>
    <line x1="188" y1="135" x2="190" y2="155"></line>
  </g>
  <path class="form-cue-pulse" d="M212 120 L212 72" stroke="#ec3013" stroke-width="2" stroke-linecap="round"></path>
  <polygon class="form-cue-pulse" points="212,72 216,80 208,80" fill="#ec3013"></polygon>
  <text x="222" y="96" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="9">pull</text>
  <circle class="form-cue-pulse" cx="180" cy="58" r="3.5" fill="#ec3013"></circle>
  <text x="180" y="50" text-anchor="middle" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="8">chin</text>
  <line x1="272" y1="48" x2="328" y2="48" stroke="#201e1d" stroke-width="3" stroke-linecap="round"></line>
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="300" cy="95" r="9"></circle>
    <line x1="300" y1="95" x2="300" y2="109"></line>
    <line x1="300" y1="109" x2="300" y2="145"></line>
    <line x1="300" y1="109" x2="286" y2="113"></line>
    <line x1="300" y1="109" x2="314" y2="113"></line>
    <line x1="286" y1="113" x2="278" y2="78"></line>
    <line x1="278" y1="78" x2="282" y2="50"></line>
    <line x1="314" y1="113" x2="322" y2="78"></line>
    <line x1="322" y1="78" x2="318" y2="50"></line>
    <line x1="300" y1="145" x2="292" y2="165"></line>
    <line x1="292" y1="165" x2="290" y2="185"></line>
    <line x1="300" y1="145" x2="308" y2="165"></line>
    <line x1="308" y1="165" x2="310" y2="185"></line>
  </g>
  <path class="form-cue-pulse" d="M332 70 L332 115" stroke="#ec3013" stroke-width="2" stroke-linecap="round"></path>
  <polygon class="form-cue-pulse" points="332,115 328,107 336,107" fill="#ec3013"></polygon>
  <text x="342" y="92.5" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="9">lower</text>
</svg>
