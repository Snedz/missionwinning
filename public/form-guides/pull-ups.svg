<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" role="img" aria-label="Pull-up form: hang, pull, chin over">
  <title>Pull-up form diagram</title>
  <rect width="360" height="220" fill="#0a0c10" rx="8"/>
  <text x="60" y="28" text-anchor="middle" fill="#8b919a" font-family="system-ui,sans-serif" font-size="11">Hang</text>
  <text x="180" y="28" text-anchor="middle" fill="#8b919a" font-family="system-ui,sans-serif" font-size="11">Pull</text>
  <text x="300" y="28" text-anchor="middle" fill="#8b919a" font-family="system-ui,sans-serif" font-size="11">Chin</text>

  <!-- Bars -->
  <line x1="25" y1="55" x2="95" y2="55" stroke="#c7a860" stroke-width="3" stroke-linecap="round"/>
  <line x1="145" y1="55" x2="215" y2="55" stroke="#c7a860" stroke-width="3" stroke-linecap="round"/>
  <line x1="265" y1="55" x2="335" y2="55" stroke="#c7a860" stroke-width="3" stroke-linecap="round"/>

  <!-- Hang -->
  <g stroke="#e8eaed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="45" y1="55" x2="45" y2="85"/>
    <line x1="75" y1="55" x2="75" y2="85"/>
    <circle cx="60" cy="100" r="9"/>
    <line x1="60" y1="109" x2="60" y2="150"/>
    <line x1="60" y1="150" x2="50" y2="185"/>
    <line x1="60" y1="150" x2="70" y2="185"/>
  </g>
  <circle cx="45" cy="70" r="3" fill="#c7a860"/>
  <text x="60" y="200" text-anchor="middle" fill="#8b919a" font-family="system-ui,sans-serif" font-size="8">dead hang</text>

  <!-- Pull -->
  <g stroke="#e8eaed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="165" y1="55" x2="165" y2="75"/>
    <line x1="195" y1="55" x2="195" y2="75"/>
    <circle cx="180" cy="85" r="9"/>
    <line x1="180" y1="94" x2="180" y2="130"/>
    <line x1="165" y1="75" x2="180" y2="94"/>
    <line x1="195" y1="75" x2="180" y2="94"/>
    <line x1="180" y1="130" x2="170" y2="165"/>
    <line x1="180" y1="130" x2="190" y2="165"/>
  </g>
  <path d="M220 120 L220 95" stroke="#27b07d" stroke-width="2" stroke-linecap="round">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </path>
  <polygon points="216,95 220,88 224,95" fill="#27b07d"/>
  <text x="226" y="110" fill="#27b07d" font-family="system-ui,sans-serif" font-size="9">elbows down</text>
  <circle cx="170" cy="80" r="3.5" fill="#c7a860"/>

  <!-- Chin -->
  <g stroke="#e8eaed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="285" y1="55" x2="290" y2="68"/>
    <line x1="315" y1="55" x2="310" y2="68"/>
    <circle cx="300" cy="72" r="9"/>
    <line x1="300" y1="81" x2="300" y2="115"/>
    <line x1="290" y1="68" x2="300" y2="81"/>
    <line x1="310" y1="68" x2="300" y2="81"/>
    <line x1="300" y1="115" x2="290" y2="150"/>
    <line x1="300" y1="115" x2="310" y2="150"/>
  </g>
  <text x="300" y="175" text-anchor="middle" fill="#27b07d" font-family="system-ui,sans-serif" font-size="9">chin over</text>
</svg>
