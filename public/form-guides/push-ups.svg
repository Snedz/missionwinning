<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" role="img" aria-label="Push-up: setup plank, mid lower, lockout">
  <style>
    /* Hero form motion — only when the athlete allows motion. */
    @media (prefers-reduced-motion: no-preference) {
      .form-phase-mid {
        animation: form-mid-bob 2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center bottom;
      }
      .form-cue-pulse {
        animation: form-cue-pulse 2s ease-in-out infinite;
      }
    }
    @keyframes form-mid-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }
    @keyframes form-cue-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
  <title>Push-up form diagram</title>
  <rect width="360" height="220" fill="#f3f2f2"></rect>
  <text x="60" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">SETUP</text>
  <text x="180" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">MID</text>
  <text x="300" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="0.5">LOCKOUT</text>
  <line x1="20" y1="185" x2="100" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="140" y1="185" x2="220" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <line x1="260" y1="185" x2="340" y2="185" stroke="#201e1d" stroke-width="2"></line>
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="102" cy="122" r="9"></circle>
    <line x1="102" y1="122" x2="90" y2="128"></line>
    <line x1="90" y1="128" x2="42" y2="130"></line>
    <line x1="90" y1="128" x2="82" y2="130"></line>
    <line x1="82" y1="130" x2="84" y2="150"></line>
    <line x1="84" y1="150" x2="88" y2="183"></line>
    <line x1="82" y1="130" x2="78" y2="155"></line>
    <line x1="78" y1="155" x2="80" y2="183"></line>
    <line x1="42" y1="130" x2="30" y2="132"></line>
    <line x1="30" y1="132" x2="12" y2="183"></line>
    <line x1="42" y1="130" x2="24" y2="134"></line>
    <line x1="24" y1="134" x2="20" y2="183"></line>
  </g>
  <circle class="form-cue-pulse" cx="84" cy="155" r="3.5" fill="#ec3013"></circle>
  <text x="84" y="147" text-anchor="middle" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="8">elbow</text>
  <g class="form-phase-mid" stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="222" cy="152" r="9"></circle>
    <line x1="222" y1="152" x2="210" y2="158"></line>
    <line x1="210" y1="158" x2="162" y2="160"></line>
    <line x1="210" y1="158" x2="202" y2="160"></line>
    <line x1="202" y1="160" x2="204" y2="163"></line>
    <line x1="204" y1="163" x2="208" y2="183"></line>
    <line x1="202" y1="160" x2="198" y2="167"></line>
    <line x1="198" y1="167" x2="200" y2="183"></line>
    <line x1="162" y1="160" x2="150" y2="162"></line>
    <line x1="150" y1="162" x2="132" y2="183"></line>
    <line x1="162" y1="160" x2="144" y2="164"></line>
    <line x1="144" y1="164" x2="140" y2="183"></line>
  </g>
  <path class="form-cue-pulse" d="M200 105 L200 140" stroke="#ec3013" stroke-width="2" stroke-linecap="round"></path>
  <polygon class="form-cue-pulse" points="200,140 196,132 204,132" fill="#ec3013"></polygon>
  <text x="210" y="122.5" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="9">LOWER</text>
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="342" cy="122" r="9"></circle>
    <line x1="342" y1="122" x2="330" y2="128"></line>
    <line x1="330" y1="128" x2="282" y2="130"></line>
    <line x1="330" y1="128" x2="322" y2="130"></line>
    <line x1="322" y1="130" x2="324" y2="150"></line>
    <line x1="324" y1="150" x2="328" y2="183"></line>
    <line x1="322" y1="130" x2="318" y2="155"></line>
    <line x1="318" y1="155" x2="320" y2="183"></line>
    <line x1="282" y1="130" x2="270" y2="132"></line>
    <line x1="270" y1="132" x2="252" y2="183"></line>
    <line x1="282" y1="130" x2="264" y2="134"></line>
    <line x1="264" y1="134" x2="260" y2="183"></line>
  </g>
  <path class="form-cue-pulse" d="M320 150 L320 115" stroke="#ec3013" stroke-width="2" stroke-linecap="round"></path>
  <polygon class="form-cue-pulse" points="320,115 324,123 316,123" fill="#ec3013"></polygon>
  <text x="330" y="132.5" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="9">PRESS</text>
</svg>
