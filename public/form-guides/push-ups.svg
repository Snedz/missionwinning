<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" role="img" aria-label="Push-up form: setup plank, mid lower, lockout">
  <title>Push-up form diagram</title>
  <rect width="360" height="220" fill="#f3f2f2"></rect>
  <text x="60" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="1">SETUP</text>
  <text x="180" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="1">MID</text>
  <text x="300" y="28" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="11" letter-spacing="1">LOCKOUT</text>
  <line x1="20" y1="175" x2="100" y2="175" stroke="#201e1d" stroke-width="2"></line>
  <line x1="140" y1="175" x2="220" y2="175" stroke="#201e1d" stroke-width="2"></line>
  <line x1="260" y1="175" x2="340" y2="175" stroke="#201e1d" stroke-width="2"></line>
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="78" cy="88" r="9"></circle>
    <line x1="72" y1="95" x2="42" y2="118"></line>
    <line x1="42" y1="118" x2="38" y2="155"></line>
    <line x1="55" y1="108" x2="42" y2="118"></line>
    <line x1="72" y1="95" x2="95" y2="155"></line>
  </g>
  <rect x="38.5" y="114.5" width="7" height="7" fill="#ec3013"></rect>
  <text x="42" y="108" text-anchor="middle" fill="#6f6b69" font-family="Archivo, system-ui, sans-serif" font-size="8" letter-spacing="0.5">ELBOW</text>
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="198" cy="118" r="9"></circle>
    <line x1="192" y1="125" x2="162" y2="138"></line>
    <line x1="162" y1="138" x2="158" y2="155"></line>
    <line x1="175" y1="132" x2="162" y2="138"></line>
    <line x1="192" y1="125" x2="215" y2="155"></line>
  </g>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ec3013"></path>
    </marker>
  </defs>
  <path d="M168 96 L168 120" stroke="#ec3013" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"></path>
  <text x="180" y="92" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="9" letter-spacing="0.5">LOWER</text>
  <rect x="158.5" y="134.5" width="7" height="7" fill="#ec3013"></rect>
  <g stroke="#201e1d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="318" cy="88" r="9"></circle>
    <line x1="312" y1="95" x2="282" y2="118"></line>
    <line x1="282" y1="118" x2="278" y2="155"></line>
    <line x1="295" y1="108" x2="282" y2="118"></line>
    <line x1="312" y1="95" x2="335" y2="155"></line>
  </g>
  <path d="M290 132 L290 108" stroke="#ec3013" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"></path>
  <text x="302" y="124" fill="#ec3013" font-family="Archivo, system-ui, sans-serif" font-size="9" letter-spacing="0.5">PRESS</text>
</svg>