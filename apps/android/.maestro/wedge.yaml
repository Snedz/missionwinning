appId: com.missionwinning.app.debug
---
- launchApp
- assertVisible: "Mission Winning"
# I-Day multi-step: skip path is fastest for smoke
- tapOn: "I already train — skip"
- assertVisible: "Today"
- assertVisible: "Start workout"
- tapOn: "Start workout"
- assertVisible: "Complete set"
- tapOn: "Complete set"
# Copy may be "Finish workout" or "Finish workout · lock session" (substring match)
- assertVisible: "Finish workout"
- tapOn: "Finish workout"
- assertVisible: "Session locked"
# First lifetime sessions show Coach CTA (pm clear → workout #1)
- tapOn: "See Mission Coach"
- assertVisible: "Mission Coach"
